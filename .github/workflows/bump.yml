name: Update releases

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - id: bump
        name: Resolve and verify release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/bump.py
          # A new release drops the old bottles, and a formula without bottles gets new ones.
          if git diff --quiet -- Formula Casks && [[ -z "$(python3 scripts/bottle.py needed)" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.bump.outputs.changed == 'true'
        with:
          name: formulas
          path: |
            Formula/
            Casks/
          if-no-files-found: error

  bottle:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # After setup-homebrew, which resets the tap checkout to the commit that started the run.
      - uses: Homebrew/actions/setup-homebrew@main
      - uses: actions/download-artifact@v8
        with:
          name: formulas
          path: .
      - name: Audit, bottle, install and test both formulas
        run: bash scripts/test.sh --keep-bottles bottles
      - uses: actions/upload-artifact@v7
        with:
          name: bottles-${{ matrix.os }}
          path: bottles/
          if-no-files-found: ignore
          compression-level: 0

  publish:
    needs: bottle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: formulas
          path: .
      - uses: actions/download-artifact@v8
        with:
          pattern: bottles-*
          path: bottles/
      - name: Write bottle blocks and publish the bottles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/bottle.py write bottles assets > written.txt
          cat written.txt
          while read -r name version; do
            tag="$name-$version"
            files=(assets/"$tag"/*)
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${files[@]}" --clobber
            else
              gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --latest=false \
                --title "$name $version bottles" \
                --notes "Homebrew bottles for $name $version, poured by \`brew install dutchman-cad/tap/$name\`."
            fi
          done < written.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bottled-formulas
          path: |
            Formula/
            Casks/
          if-no-files-found: error

  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # After setup-homebrew, which resets the tap checkout to the commit that started the run.
      - uses: Homebrew/actions/setup-homebrew@main
      - uses: actions/download-artifact@v8
        with:
          name: bottled-formulas
          path: .
      - name: Audit, pour and test both formulas
        run: bash scripts/test.sh

  commit:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v8
        with:
          name: bottled-formulas
          path: .
      - name: Commit verified formulas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for formula in dutchman dutchman-pilot; do
            path="Formula/$formula.rb"
            if ! git diff --quiet -- "$path"; then
              version=$(sed -n 's#.*/releases/download/v\([^/"]*\)/.*#\1#p' "$path" | head -n 1)
              test -n "$version"
              message="$formula $version"
              # A change that keeps the release only adds bottles.
              if ! git diff -U0 -- "$path" | grep -q '^[-+] *url '; then
                message="$message bottles"
              fi
              git add "$path"
              git commit -m "$message"
            fi
          done
          for cask in dutchman-convert; do
            path="Casks/$cask.rb"
            if ! git diff --quiet -- "$path"; then
              version=$(sed -n 's/^  version "\([^"]*\)"$/\1/p' "$path")
              test -n "$version"
              git add "$path"
              git commit -m "$cask $version"
            fi
          done
          git push
