name: Test formulas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Every commit on main finishes its run; a newer push cancels an older one elsewhere.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test release updater
        # Authenticated API calls: shared runner addresses hit the anonymous rate limit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m unittest discover -s tests -v
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Audit, bottle, install and test both formulas
        run: bash scripts/test.sh
